<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Labour Chowk - Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F7FA;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
            position: relative;
        }

        .header {
            background-color: #3F51B5;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #eee;
        }

        .card:hover { transform: translateY(-2px); }

        .icon-box {
            width: 50px;
            height: 50px;
            background: #E8EAF6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .title { font-size: 24px; font-weight: bold; color: #3F51B5; text-align: center; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: bold; margin: 0; }
        .card-sub { font-size: 14px; color: #666; margin: 4px 0 0 0; }

        /* Keypad reminder */
        .keypad-hint {
            position: absolute;
            bottom: 20px;
            left: 0; right: 0;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="header">Digital Labour Chowk</div>
        <div class="content">
            <div class="title">आप कौन हैं?<br>(Who are you?)</div>
            
            <div class="card" onclick="alert('Worker Screen: Not fully mocked in HTML. Using Flutter for real app!')">
                <div class="icon-box">👷</div>
                <div>
                    <h3 class="card-title">काम चाहिए (Worker)</h3>
                    <p class="card-sub">Press 1 on Keypad</p>
                </div>
            </div>

            <div class="card" onclick="alert('Employer Screen: Not fully mocked in HTML. Using Flutter for real app!')">
                <div class="icon-box">💼</div>
                <div>
                    <h3 class="card-title">काम देना है (Employer)</h3>
                    <p class="card-sub">Press 2 on Keypad</p>
                </div>
            </div>
        </div>
        <div class="keypad-hint">Mock HTML Preview (To test fast)</div>
    </div>

    <script>
        document.addEventListener('keydown', (e) => {
            if(e.key === '1') alert('Worker Screen clicked! (Keypad 1)');
            if(e.key === '2') alert('Employer Screen clicked! (Keypad 2)');
        });
    </script>
</body>
</html>
