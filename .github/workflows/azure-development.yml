name: Deploy E-Chowk to Azure

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Build & Deploy Backend API to Azure App Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Typecheck Backend Code
        run: npm run typecheck

      - name: Run Backend Tests
        run: npm test -- --runInBand

      - name: Build Backend App
        run: npm run build

      - name: Prepare Deployment Zip
        run: |
          mkdir -p deploy-pkg
          cp -r dist package.json package-lock.json node_modules deploy-pkg/
          cd deploy-pkg && zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Service for prebuilt Node deployment
        run: |
          RESOURCE_GROUP=$(az webapp show --name echowk-dev-api --query resourceGroup -o tsv)
          az webapp config set             --resource-group "$RESOURCE_GROUP"             --name echowk-dev-api             --linux-fx-version "NODE|20-lts"             --startup-file "node dist/main.js"
          az webapp config appsettings set             --resource-group "$RESOURCE_GROUP"             --name echowk-dev-api             --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Deploy prebuilt Backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'echowk-dev-api'
          package: 'backend/deploy.zip'

  deploy-web:
    name: Build & Deploy Flutter Web to Azure Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: flutter build web --release --dart-define=API_BASE_URL=https://echowk-dev-api.azurewebsites.net

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload Web Build to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name echowkwebdev \
            --source build/web \
            --destination '$web' \
            --overwrite \
            --auth-mode login
