name: Deploy E-Chowk to Azure

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Build & Deploy Backend API to Azure App Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Typecheck Backend Code
        run: npm run typecheck

      - name: Run Backend Tests
        run: npm test -- --runInBand

      - name: Build Backend App
        run: npm run build

      - name: Prepare Deployment Zip
        run: |
          mkdir -p deploy-pkg
          cp -r dist src package.json package-lock.json tsconfig.json nest-cli.json node_modules deploy-pkg/
          cd deploy-pkg && zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'echowk-dev-api'
          package: 'backend/deploy.zip'

  deploy-web:
    name: Build & Deploy React Web to Azure Storage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_react
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web_react/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Build React Web for Azure
        run: npm run build:azure

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload Web Build to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name echowkwebdev \
            --source .output/public \
            --destination '$web' \
            --overwrite \
            --auth-mode login
